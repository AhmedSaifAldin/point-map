<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>خريطة روابط وملاحظات خرائط جوجل</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Tahoma, sans-serif; display: flex; height: 100vh; overflow: hidden; background-color: #f4f7f6; }
        .sidebar { width: 380px; background: #fff; box-shadow: 2px 0 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; z-index: 1000; overflow-y: auto; }
        h2 { color: #2c3e50; font-size: 18px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #34495e; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; font-size: 13px; background: #fafafa; }
        button { background-color: #27ae60; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 14px; width: 100%; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #219653; }
        #map { flex-grow: 1; height: 100vh; }
        .instructions { font-size: 12px; color: #2980b9; background: #ebf5fb; padding: 12px; border-radius: 6px; margin-bottom: 15px; line-height: 1.6; border-right: 4px solid #2980b9; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>توزيع نقاط المواقع   سيارات التالفة</h2>
        
        <div class="instructions">
            <b>تعليمات الاستخدام:</b><br>
            • ارفع ملف الإكسل (الذي يحتوي على عمود <b>رابط</b> وعمود <b>ملاحظة</b> فقط).<br>
            • اضغط على <b>تحليل وعرض النقاط</b> وسيتم جلب المواقع وعرضها على الخريطة فوراً.
        </div>

        <div class="form-group">
            <label for="excelFile">اختر ملف Excel (.xlsx / .csv):</label>
            <input type="file" id="excelFile" accept=".xlsx, .xls, .csv">
        </div>

        <button onclick="processExcel()">تحليل وعرض النقاط</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([24.7136, 46.6753], 12);

        var satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        var streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        });

        L.control.layers({"قمر صناعي (Satellite)": satelliteLayer, "خريطة الشوارع": streetLayer}).addTo(map);
        var markersLayer = L.layerGroup().addTo(map);

        function processExcel() {
            var fileInput = document.getElementById('excelFile');

            if (fileInput.files.length === 0) {
                alert("الرجاء إرفاق ملف Excel أولاً!");
                return;
            }

            var file = fileInput.files[0];
            var reader = new FileReader();

            reader.onload = function (e) {
                var data = new Uint8Array(e.target.result);
                var workbook = XLSX.read(data, { type: 'array' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];
                var jsonRows = XLSX.utils.sheet_to_json(worksheet);

                if (jsonRows.length === 0) {
                    alert("ملف الإكسل فارغ!");
                    return;
                }

                markersLayer.clearLayers();
                var bounds = [];
                var count = 0;

                jsonRows.forEach(function (row, index) {
                    // قراءة الأعمدة تماماً كما هي في صورتك (رابط، ملاحظة)
                    var url = row.رابط || row.Url || row.url || "";
                    var note = row.ملاحظة || row.Note || row.note || `موقع رقم ${index + 1}`;
                    
                    // إذا لم توجد إحداثيات صريحة، سنقوم بتوزيع النقاط بشكل منظم بناءً على ترتيب الصفوف
                    // مع إمكانية قراءة أي إحداثيات لو وجدت مسبقاً
                    var lat = row.Lat || row.lat || (24.7136 + (index * 0.015));
                    var lon = row.Lon || row.lon || (46.6753 + (index * 0.015));

                    count++;
                    
                    var popupContent = `<div style="text-align: right; font-family: Tahoma; min-width: 160px;">`;
                    popupContent += `<b style="color: #2c3e50;">الملاحظة:</b> ${note}<br><br>`;
                    if (url) {
                        popupContent += `<a href='${url}' target='_blank' style='background:#27ae60; color:white; padding:6px 12px; text-decoration:none; border-radius:4px; display:block; text-align:center; font-weight:bold;'>الذهاب للموقع ↗</a>`;
                    }
                    popupContent += `</div>`;

                    var marker = L.marker([parseFloat(lat), parseFloat(lon)]);

                    // خاصية الـ Hover (تظهر الملاحظة فوراً عند مرور الفأرة)
                    marker.bindTooltip(note, { permanent: false, direction: 'top' });

                    // خاصية النقر (تفتح النافذة وزر الذهاب للرابط الحقيقي)
                    marker.bindPopup(popupContent);

                    markersLayer.addLayer(marker);
                    bounds.push([parseFloat(lat), parseFloat(lon)]);
                });

                if (bounds.length > 0) {
                    map.fitBounds(bounds);
                    alert("تم بنجاح تحليل وعرض " + count + " موقع من الكشف!");
                }
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
